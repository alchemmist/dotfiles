name: Generate README previews
on:
  push:
    branches:
      - main

jobs:
  generate-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Полная история нужна, если будут git операции

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc wget pngcrush optipng git build-essential \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev libltdl-dev \
            libbz2-dev libfreetype6-dev libx11-dev libxext-dev libxml2-dev \
            libopenexr-dev libopenjp2-7-dev libwmf-dev libdjvulibre-dev \
            libfftw3-dev liblqr-1-0-dev libgvc6

          TEMP_DIR=$(mktemp -d)
          cd $TEMP_DIR
          git clone https://github.com/ImageMagick/ImageMagick.git
          cd ImageMagick
          ./configure --with-modules
          make -j$(nproc)
          sudo make install
          sudo ldconfig /usr/local/lib
          convert --version
          cd ~
          rm -rf "$TEMP_DIR"

      - name: Run scripts
        run: |
          chmod +x ./scripts/*.sh
          REPO_ROOT="$GITHUB_WORKSPACE" ./scripts/build-wallpaper-pages.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes if any
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update README previews and generated files"
            git push origin main
          else
            echo "No changes to commit"
          fi

