theme = "dark"

# ============================================================================
#  lazy-tmux configuration
# ============================================================================
#
#  Every key below is set to its BUILT-IN DEFAULT. This file is a full,
#  explicit reference — you can safely delete any key and lazy-tmux will fall
#  back to exactly the value shown here.
#
#  Lookup order (first match wins):
#    1. $LAZY_TMUX_CONFIG
#    2. $XDG_CONFIG_HOME/lazy-tmux/lazy-tmux.toml
#    3. ~/.config/lazy-tmux/lazy-tmux.toml   <- this file
#
#  Precedence: built-in defaults  ->  this file  ->  command-line flags.
#  Run `lazy-tmux config show` to print the effective config actually in use.
#
# ----------------------------------------------------------------------------
#  Commands (run `lazy-tmux <command> -h` for flags)
# ----------------------------------------------------------------------------
#    save          Save the current, a specific, or all sessions
#    restore       Restore one saved session from disk
#    wakeup        Restore a saved session without switching clients
#    sleep         Save and close a running session
#    forget        Remove a stored session from disk
#    picker        Open the session picker and restore the selection
#    bootstrap     Restore one session at tmux startup (latest or named)
#    daemon        Periodically autosave all sessions in the background
#    list          List saved sessions
#    setup         Print tmux keybindings to wire lazy-tmux into tmux
#    config        Generate (gen) or show the effective config
#    claude-hooks  Install or remove Claude Code live-status hooks
#    hook          Internal hook entrypoints (used by Claude Code)
#    version       Print the version
# ============================================================================


# ----------------------------------------------------------------------------
#  Core
# ----------------------------------------------------------------------------

# tmux binary to invoke. A leading ~ is expanded. Set this if your tmux is a
# shell alias or lives outside PATH (e.g. "~/bin/tmux.appimage").
tmux_bin = "tmux"

# Directory where session snapshots are stored. A leading ~ is expanded.
data_dir = "~/.local/share/lazy-tmux"

# Autosave interval for the background daemon (Go duration, e.g. "30s", "5m").
save_interval = "5m"

# How long restore waits for each restored pane command to actually start
# before returning. "0s" disables waiting (old fire-and-forget behavior).
restore_timeout = "5s"

# Allowlist of commands lazy-tmux may replay on restore, matched by program
# name (e.g. "nvim" matches "/usr/bin/nvim main.go").
#
# DEFAULT = key omitted = restore EVERY command. This is the default, so the
# key is left commented on purpose: any concrete value changes behavior
# (a list restores only those programs; an empty list [] restores none).
# Uncomment and edit only if you want to restrict restore.
# restore_allowlist = ["nvim", "vim", "htop", "less", "tail", "ssh"]


# ----------------------------------------------------------------------------
#  Scrollback capture
# ----------------------------------------------------------------------------
[scrollback]
# Capture and replay shell pane scrollback on save/restore.
enabled = false
# Maximum scrollback lines captured per pane.
lines = 5000


# ----------------------------------------------------------------------------
#  Program integrations
# ----------------------------------------------------------------------------
#  When a pane runs a supported program, lazy-tmux records program-specific
#  state on save and replays a smarter command on restore. Integrations compose
#  with restore_allowlist: if an allowlist is set, the program must be in it
#  (e.g. "claude") for its command to be replayed.
[integrations]
# Master switch for all program integrations.
enabled = true

# Claude Code: restore a `claude` pane as `claude --resume <session-id>` so the
# conversation continues instead of starting fresh.
[integrations.claude]
enabled = true
# Claude Code data directory. Transcripts are read from
# <home>/projects/<cwd>/<session-id>.jsonl to resolve the pane's session.
# A leading ~ is expanded.
home = "~/.claude"
