"$schema" = 'https://starship.rs/config-schema.json'

format = "$directory$git_branch$git_status$python\n$character"

add_newline = true

[character]
success_symbol = "[➜](fg)"
error_symbol = "[➜](red)"

vicmd_symbol = "[➜](green)"
vimcmd_replace_one_symbol = "[➜](green)"
vimcmd_replace_symbol = "[➜](green)"
vimcmd_visual_symbol = "[➜](green)"

[directory]
style = "fg"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
format = "[$symbol $branch]($style) "
style = "green"

[git_status]
style = "green"

format = "$conflicted$staged$renamed$modified$deleted$untracked$stashed$ahead_behind "

conflicted = "🏳"
staged     = " "
renamed    = ""
modified   = " "
deleted    = "✘ "
untracked  = " "
stashed    = "📦"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
typechanged = ""

[python]
symbol = ""
format = "[$virtualenv](#d787af) "
