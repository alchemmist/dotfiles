"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
${custom.gahead}\
${custom.gbehind}\
${custom.venv}\
${custom.docker}\
${custom.makefile}\
$python\n\
$jobs\
$character\
"""

[character]
success_symbol = "[➜](fg)"
error_symbol = "[➜](red)"
vicmd_symbol = "[➜](green)"
vimcmd_replace_one_symbol = "[➜](green)"
vimcmd_replace_symbol = "[➜](green)"
vimcmd_visual_symbol = "[➜](green)"

[directory]
style = "fg"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
format = "[$symbol $branch](green) "

[git_status]
format = "[$conflicted](red)$modified[$staged](green)[$renamed](yellow)[$deleted](red)[$untracked](blue)$stashed"
conflicted = "🏳"
staged = "󰸞 "
renamed = " "
modified = " "
deleted = "✘ "
untracked = " "
stashed = "📦 "
# ahead = "󱦲 ${count}"
# behind = "󱦳 ${count}"
ahead = ""
behind = ""
diverged = "⇕"
up_to_date = ""
typechanged = ""

[python]
symbol = ""
format = ""

[custom.gahead]
description = "Shows the docker symbol if the current directory has Dockerfile or docker-compose.yml files"
command = """
git rev-list --count @{u}..HEAD 2>/dev/null | awk '{for(i=0;i<$1;i++) printf ""}'
"""
style = "($fg)"
detect_folders = [".git"]

[custom.gbehind]
description = "Shows dots for commits behind remote"
command = """
git rev-list --count HEAD..@{u} 2>/dev/null | awk '{for(i=0;i<$1;i++) printf ""}'
"""
style = "($fg)"
detect_folders = [".git"]

[custom.docker]
description = "Shows the docker symbol if the current directory has Dockerfile or docker-compose.yml files"
style = "($fg)"
command = "printf ' '"
files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml"]
when = """ command -v docker &> /dev/null; exit (echo $?); """

[custom.makefile]
detect_files = ["Makefile", "makefile"]
symbol = " "
style = "($fg)"
format = "[$symbol]($style)"

[custom.venv]
description = "Shows Python virtual environment if active"
command = "echo  $(basename $VIRTUAL_ENV)"
when = 'test -n "$VIRTUAL_ENV"'
style = "#d787af"
