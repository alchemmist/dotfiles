"$schema" = 'https://starship.rs/config-schema.json'

format = "$directory$git_branch$git_status\n$character"


add_newline = true

[character]
success_symbol = '[➜](#fff)'

[directory]
style = "#ffffff"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[package]
disabled = true

[git_branch]
symbol = ""
format = "[$symbol $branch]($style) "
style = "green"

[git_status]
style = "green"
