general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1000
}

auth {
    fingerprint {
        enabled = true
        ready_message = Touch the fingerprint sensor to unlock
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}


background {
    monitor =
    # path = /home/alchemmist/Pictures/wallpapers/art/images/vrubel-mihail-aleksandrovich.jpg
    # path = screenshot
    path = /home/alchemmist/Pictures/wallpapers/current-wallpaper
    blur_size = 5       # сила размытия (чем больше число — тем сильнее блюр)
    blur_passes = 2     # количество проходов размытия (качество/гладкость)
    brightness = 0.7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 22
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgba(255, 255, 255, 0.5)
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, 120
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrainsMono NFM

    position = 0, -15
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -40
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:100] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap' | cut -c 1-2)"
    color = rgba(255, 255, 255, 0.2)
    font_size = 15
    font_family = JetBrainsMonoNerdFontMono-ExtraLightItalic
    position = -15, 10
    halign = right
    valign = bottom
}

label {
    monitor = 
    text = cmd[update:100] echo "$(/home/alchemmist/scripts/battery_stat.sh)"
    color = rgba(255, 255, 255, 0.2)
    font_size = 15
    font_family = JetBrainsMonoNerdFontMono-ExtraLightItalic
    position = -50, 10
    halign = right
    valign = bottom
}
