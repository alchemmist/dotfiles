[helpers]

[shared]
depends = []

[shared.files]
"zsh/.zshrc" = "~/.zshrc"
"tmux/.tmux.conf" = "~/.tmux.conf"
"lazy-tmux/lazy-tmux.toml" = "~/.config/lazy-tmux/lazy-tmux.toml"
"neovim" = "~/.config/nvim"
"kitty" = "~/.config/kitty"
"git/.gitconfig" = "~/.gitconfig"
"git/.gitignore_global" = "~/.gitignore_global"
"ssh/config" = "~/.ssh/config"
"scripts" = "~/scripts"
"alacritty" = "~/.config/alacritty"
"fastfetch" = "~/.config/fastfetch"
"wallpapers" = "~/Pictures/wallpapers"
"vim/.vimrc" = "~/.vimrc"
"helix" = "~/.config/helix"
"starship" = "~/.config/starship"
"yazi" = "~/.config/yazi"
"codex/AGENTS.md" = { target = "~/.codex/AGENTS.md", type = "symbolic" }
"codex/skills/arc-worktrees" = { target = "~/.codex/skills/arc-worktrees", type = "symbolic" }
"codex/skills/grill-me" = { target = "~/.codex/skills/grill-me", type = "symbolic" }
"codex/skills/grilling" = { target = "~/.codex/skills/grilling", type = "symbolic" }
"codex/skills/impeccable" = { target = "~/.codex/skills/impeccable", type = "symbolic" }
"codex/skills/rebase" = { target = "~/.codex/skills/rebase", type = "symbolic" }
"hammerspoon/init.lua" = { target = "~/.hammerspoon/init.lua", type = "symbolic" }
"hammerspoon/startup-layout.lua" = { target = "~/.hammerspoon/startup-layout.lua", type = "symbolic" }

[shared.variables]

[default]
depends = ["shared"]

[default.files]
"codex/config.toml" = { target = "~/.codex/config.toml", type = "symbolic" }

[linux]
depends = ["shared"]

[linux.files]
"waybar" = "~/.config/waybar"
"hypr" = "~/.config/hypr"
"sway" = "~/.config/sway"
"wofi" = "~/.config/wofi"
"wlinitrc/wlinitrc" = "~/.local/bin/wlinitrc"
"zathura" = "~/.config/zathura"
"mako" = "~/.config/mako"
"wlogout" = "~/.config/wlogout"
"swaync" = "~/.config/swaync"
"systemd" = "~/.config/systemd/user"

[macos]
depends = ["default"]

[settings]
default_target_type = "automatic"
