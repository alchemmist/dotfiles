[helpers]

[shared]
depends = []

[shared.files]
"zsh/.zshrc" = "~/.zshrc"
"tmux/.tmux.conf" = "~/.tmux.conf"
"lazy-tmux/lazy-tmux.toml" = "~/.config/lazy-tmux/lazy-tmux.toml"
"neovim" = "~/.config/nvim"
"kitty" = "~/.config/kitty"
"git/.gitconfig" = "~/.gitconfig"
"git/.gitignore_global" = "~/.gitignore_global"
"ssh/config" = "~/.ssh/config"
"scripts" = "~/scripts"
"alacritty" = "~/.config/alacritty"
"fastfetch" = "~/.config/fastfetch"
"wallpapers" = "~/Pictures/wallpapers"
"vim/.vimrc" = "~/.vimrc"
"helix" = "~/.config/helix"
"starship" = "~/.config/starship"
"yazi" = "~/.config/yazi"
"antex/AGENTS.md" = { target = "~/.antex/AGENTS.md", type = "symbolic" }
"hammerspoon/init.lua" = { target = "~/.hammerspoon/init.lua", type = "symbolic" }
"hammerspoon/startup-layout.lua" = { target = "~/.hammerspoon/startup-layout.lua", type = "symbolic" }

[shared.variables]

[default]
depends = ["shared"]

[default.files]
"antex/config.toml" = { target = "~/.antex/config.toml", type = "symbolic" }
"antex/github-mcp-server-antex" = { target = "~/.local/bin/github-mcp-server-antex", type = "symbolic" }

[linux]
depends = ["shared"]

[linux.files]
"waybar" = "~/.config/waybar"
"hypr" = "~/.config/hypr"
"sway" = "~/.config/sway"
"wofi" = "~/.config/wofi"
"wlinitrc/wlinitrc" = "~/.local/bin/wlinitrc"
"zathura" = "~/.config/zathura"
"mako" = "~/.config/mako"
"wlogout" = "~/.config/wlogout"
"swaync" = "~/.config/swaync"
"systemd" = "~/.config/systemd/user"

[macos]
depends = ["default"]

[settings]
default_target_type = "automatic"
