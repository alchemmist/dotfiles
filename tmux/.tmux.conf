set -g default-terminal "tmux-256color"

setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 100
set -s focus-events on

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

bind w choose-tree -ZwN
bind s choose-tree -ZsN

bind C-c new-session
bind c new-window -c "#{pane_current_path}"
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind o switch-client -l

bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
bind > swap-pane -D
bind < swap-pane -U
bind BSpace kill-pane
bind-key -T popup BSpace kill-pane

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r n last-window
bind-key -n M-h swap-window -t -1 -d
bind-key -n M-l swap-window -t +1 -d

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | wl-copy"'
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "tmux save-buffer - > /dev/clipboard"'

bind b list-buffers
bind-key -n C-v paste-buffer -p
bind P choose-buffer
bind E show-environment -g

bind e display-popup -E -w 80% -h 60% -d "#{pane_current_path}" -e TMUX_POPUP=1 "$SHELL"
bind i run-shell 'tmux display-popup -w 100% -h 40% -x 0 -y "$(tmux display-message -p "#{client_height}")-((($(tmux display-message -p "#{client_height}"))*40)/100)" -E "cd $(tmux display-message -p "#{pane_current_path}") && gh issue list || true"'
bind g run-shell 'cd $(tmux display-message -p "#{pane_current_path}") && gh repo view --web > /dev/null 2>&1 || true'

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

set -g history-limit 5000

set -g mouse on

bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

set -g status-position top
set -g status-justify absolute-centre

set -g @theme "dark"

set -g status-style "fg=#8a8a8a,bg=default,none"
set -g window-status-style "fg=#8a8a8a,bg=default,none"
set -g window-status-current-style "fg=#8fce72,bg=default,bold"
set -g window-status-format "#I #W"
set -g window-status-current-format "#I #W"
set -g window-status-separator " "

set -g status-left " #S"
set -g status-left-length 50
set -g status-left-style "fg=#8a8a8a,bg=default,bold"

set -g status-right ""
set -g status-right-length 50
set -g status-right-style "fg=#8a8a8a,bg=default,none"

set -g pane-border-style "fg=#303030,bg=default"
set -g pane-active-border-style "fg=#6aa84f,bg=default"

set -g message-style "fg=#8a8a8a,bg=default,none"
set -g message-command-style "fg=#8fce72,bg=default,none"

set -g mode-style "fg=#6aa84f,bg=default,none"

set -g set-clipboard on

bind-key C-z set-option -g status
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"
bind-key m switch-client -t tmp \; select-window -t tmp:1
bind-key f popup "$HOME/scripts/tmux_window_finder.sh"
bind-key w choose-window

run-shell -b 'lazy-tmux daemon --interval 3m >/tmp/lazy-tmux.log 2>&1'
unbind-key -n s
bind-key s run-shell 'lazy-tmux save --all'
bind-key f display-popup -E 'lazy-tmux picker'
