set -g default-terminal "tmux-256color"

# Advertise truecolor and synchronized updates from Alacritty to programs inside
# tmux. Synchronized updates keep a TUI frame hidden until it is fully rendered.
set -g terminal-features[3] "xterm-256color:RGB:sync"

setw -g xterm-keys on
set -s user-keys[0] "\e[25~"
set -s user-keys[1] "\e[26~"
set -s escape-time 10
set -sg repeat-time 100
set -s focus-events on

set -g remain-on-exit on

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

bind w choose-tree -ZwN
bind s choose-tree -ZsN

bind C-c new-session
bind c new-window -c "#{pane_current_path}"
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind o switch-client -l
# Respawn a dead pane in its previous working directory.
bind R respawn-pane -c "#{pane_current_path}"

bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
bind > swap-pane -D
bind < swap-pane -U

unbind BSpace
unbind-key -T popup BSpace

bind \\ kill-pane
bind-key -T popup \\ kill-pane

bind -r h select-pane -L
bind j display-popup -B -x 0 -y C -w 32 -h 50% -E '"$HOME/go/bin/lazy-tmux" picker --sessions-only'
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r n last-window
bind-key -n User0 previous-window
bind-key -n User1 next-window
bind-key -n F11 display-popup -B -x 0 -y C -w 32 -h 50% -E '"$HOME/go/bin/lazy-tmux" picker --sessions-only --start-next'
bind-key -n F12 display-popup -B -x 0 -y C -w 32 -h 50% -E '"$HOME/go/bin/lazy-tmux" picker --sessions-only'
bind-key -n M-h swap-window -t -1 -d
bind-key -n M-l swap-window -t +1 -d

set -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
set -g mouse on


bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | wl-copy"'
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "tmux save-buffer - > /dev/clipboard"'

bind b list-buffers
bind-key -n C-v paste-buffer -p
bind P choose-buffer
bind E show-environment -g

bind e display-popup -E -w 90% -h 75% -d "#{pane_current_path}" -e TMUX_POPUP=1 "$SHELL"
bind I run-shell 'tmux display-popup -w 100% -h 40% -x 0 -y "$(tmux display-message -p "#{client_height}")-((($(tmux display-message -p "#{client_height}"))*40)/100)" -E "cd $(tmux display-message -p "#{pane_current_path}") && gh issue list || true"'
bind g run-shell 'cd $(tmux display-message -p "#{pane_current_path}") && gh repo view --web > /dev/null 2>&1 || true'
bind-key F run-shell '"$HOME/go/bin/lazy-tmux" codex-fork --pane "#{pane_id}" || tmux display-message "Could not fork the focused Codex session"'

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

set -g history-limit 500000

set -g mouse on

unbind -n C-l
bind -n C-l send-keys C-l

set -g status-position top
set -g status-justify absolute-centre

set -g @theme "dark"

set -g status-style "fg=#8a8a8a,bg=default,none"
set -g window-status-style "fg=#8a8a8a,bg=default,none"
set -g window-status-current-style "fg=#487413,bg=default,bold"
set -g window-status-format "#I #W"
set -g window-status-current-format "#I #W"
set -g window-status-separator " "

set -g status-left "        #S"
set -g status-left-length 50
set -g status-left-style "fg=#8a8a8a,bg=default,bold"

set -g status-right ""
set -g status-right-length 120
set -g status-right-style "fg=#8a8a8a,bg=default,none"

set -g pane-border-style "fg=#303030,bg=default"
set -g pane-active-border-style "fg=#6aa84f,bg=default"

set -g message-style "fg=#8a8a8a,bg=default,none"
set -g message-command-style "fg=#8fce72,bg=default,none"

set -g mode-style "fg=#6aa84f,bg=default,none"

set -g set-clipboard on

bind-key C-z set-option -g status
bind r source-file ~/.tmux.conf \; resize-window -A \; set-option -wu window-size \; display "~/.tmux.conf sourced"
bind-key m switch-client -t tmp \; select-window -t tmp:1
bind-key f popup "$HOME/scripts/tmux_window_finder.sh"
bind-key w choose-window

run-shell -b '"$HOME/go/bin/lazy-tmux" daemon --interval 1m --scrollback >/tmp/lazy-tmux.log 2>&1 || tmux display-message "lazy-tmux daemon already running"'
bind-key f display-popup -B -E -w 45% -h 55% '"$HOME/go/bin/lazy-tmux" picker'
bind-key C-s run-shell '"$HOME/go/bin/lazy-tmux" save --all --scrollback && tmux display-message "All sessions saved successfully!"'

set -g @flash-key 's'
set -g @flash-from-normal-mode 'on'
run-shell "$HOME/scripts/install-tmux-plugins.sh"
if-shell '[ -x "$HOME/.tmux/plugins/tmux-flash/flash.tmux" ]' 'run-shell "$HOME/.tmux/plugins/tmux-flash/flash.tmux"'
bind-key -T copy-mode-vi s run-shell -b '"$HOME/scripts/tmux-flash"'
bind-key s run-shell -b '"$HOME/scripts/tmux-flash"'

# tmux-claude-usage — подогнано под минималистичную тему.
# Стиль gauge сжимает шкалу до одного глифа nf-md-circle_slice, поэтому три
# показателя влезают в строку. Claude показывает и 5-часовое окно, и недельное
# (show=all); Codex — только недельное (другого он не отдаёт).
set -g @claude_usage_color_normal   "#8a8a8a"
set -g @claude_usage_color_warning  "#c8a45c"
set -g @claude_usage_color_critical "#cc6666"
# Подписи и время до ресета держат ровный цвет, порогами красятся только шкала
# и процент — иначе на 90% краснеет и слово «codex», и глазу не за что зацепиться.
set -g @claude_usage_label_color    "#6c6c6c"
set -g @claude_usage_style          "gauge"
set -g @claude_usage_show           "all"
set -g @claude_usage_show_reset     "on"
set -g @claude_usage_icon           "claude"
set -g @claude_usage_weekly_icon    "weekly"
set -g @claude_usage_codex          "on"
set -g @claude_usage_codex_icon     "codex"
set -g @claude_usage_codex_only     "on"
# Разделитель между модулями — тусклая вертикальная черта.
set -g @claude_usage_separator      "#[fg=#585858] │ #[default]"
# Зелёный индикатор режима истории/выделения перед AI-модулями.
set -g status-right '#{?pane_in_mode,#[fg=#8fce72]●#[default] ,}#{claude_usage} '
if-shell '[ -x "$HOME/.tmux/plugins/tmux-claude-usage/claude-usage.tmux" ]' 'run-shell "$HOME/.tmux/plugins/tmux-claude-usage/claude-usage.tmux"'

set -g extended-keys on
set -g extended-keys-format csi-u
