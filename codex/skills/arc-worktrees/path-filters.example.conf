# arc-worktrees — per-project path-filter map (EXAMPLE)
# Copy to ~/.config/arc-worktrees/path-filters.conf and edit.
#
# Format:  <project-prefix>   <filter1> <filter2> ...
#   - <project-prefix> is matched against your cwd relative to the arc mount root
#     (e.g. cwd ~/arcadia/foo/bar -> rel "foo/bar").
#   - The longest matching prefix wins.
#   - Each <filter> is passed as `arc mount --path-filter <filter>` (selective checkout).
#   - System paths (ya, devtools, build, .arcadia.root, .arcignore, junk/$USER) are
#     ALWAYS added automatically by resolve-path-filter — do NOT list them here.
#   - If cwd matches no line, the project's own relative path is used as the only filter.
#
# Tip: start with just the project path. When `ya make` fails with a missing path,
# add that path (e.g. contrib/libs/..., library/cpp/...) to this project's line and
# either remount or run `arc checkout --path-filter ...` to extend the working set.

# my/project          my/project contrib/libs/foo library/cpp/bar
# taxi                taxi frontend/packages
# devtools/ya         devtools build
